name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/helpdesk/values-dev.yaml"

  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: helpdesk

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest


  build-and-push:
    needs: quality

    # Do not push images from PRs
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA} .

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}

      - name: Update dev image tag
        run: |
          pip install pyyaml

          python - <<'PY'
          import os
          import yaml

          path = "helm/helpdesk/values-dev.yaml"

          with open(path) as f:
              values = yaml.safe_load(f)

          values["image"]["tag"] = os.environ["GITHUB_SHA"]

          with open(path, "w") as f:
              yaml.safe_dump(values, f, sort_keys=False)
          PY

      - name: Commit dev deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/helpdesk/values-dev.yaml

          git diff --cached --quiet || \
            git commit -m "deploy(dev): ${GITHUB_SHA}"

          git push