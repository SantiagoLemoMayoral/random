mode: deployment

replicaCount: 1

image:
  repository: otel/opentelemetry-collector

command:
  name: otelcol

config:

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_mib: 400

    batch: {}

  exporters:

    prometheus:
      endpoint: "0.0.0.0:8889"

    otlphttp/loki:
      endpoint: "http://loki:3100/otlp"

    otlp/tempo:
      endpoint: "tempo:4317"
      tls:
        insecure: true

  service:

    pipelines:

      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheus

      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/loki

      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/tempo